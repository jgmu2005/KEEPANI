name: Descubrir tiendas (Common Crawl)

# Busca tiendas e-commerce nuevas de Nicaragua: baja los dominios .ni de Common
# Crawl y a cada uno le prueba las huellas de WooCommerce/Shopify. El resultado
# (TSV: dominio, plataforma, # productos) queda en el log y como artifact para revisar.
# NO agrega nada solo — el alta de tienda sigue siendo manual (retail vs B2B, precios).
on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 1 * *'   # el día 1 de cada mes ~09:30 UTC

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json

      - name: Descubrir
        run: php web/cli/discover_stores.php | tee candidatos.tsv

      - name: Guardar candidatos como artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiendas-candidatas
          path: candidatos.tsv
          retention-days: 90
