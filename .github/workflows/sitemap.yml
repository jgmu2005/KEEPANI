name: Crawl Magento por sitemap (Gallo)

on:
  workflow_dispatch:
    inputs:
      store:
        description: 'Tienda (gallo o all)'
        required: true
        default: 'gallo'
  schedule:
    - cron: '30 8 * * *'   # diario 08:30 UTC — después del crawl VTEX (refresco de Gallo)

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
      - name: Crawl por sitemap
        env:
          OJO_INGEST_URL: ${{ secrets.OJO_INGEST_URL }}
          OJO_INGEST_KEY: ${{ secrets.OJO_INGEST_KEY }}
        run: php web/cli/crawl_sitemap.php "${{ github.event.inputs.store || 'gallo' }}"
