name: Crawl Magento por sitemap (Gallo + Unicomer)

# Cada tienda corre como un JOB PARALELO independiente (matriz), con su propio
# presupuesto de ~6h. Antes iban las 4 en serie en un solo job y chocaban contra
# el límite de tiempo (Tropigas ~9k productos, 1 fetch OG por producto).

on:
  workflow_dispatch:
    inputs:
      store:
        description: 'Tienda (all, gallo, lacuracao, radioshack, tropigas)'
        required: true
        default: 'all'
  schedule:
    - cron: '30 8 * * *'   # diario 08:30 UTC — después del crawl VTEX

jobs:
  # Arma la lista de tiendas a crawlear (todas, o una puntual desde el dispatch).
  setup:
    runs-on: ubuntu-latest
    outputs:
      stores: ${{ steps.pick.outputs.stores }}
    steps:
      - id: pick
        run: |
          STORE="${{ github.event.inputs.store || 'all' }}"
          if [ "$STORE" = "all" ]; then
            echo 'stores=["gallo","lacuracao","radioshack","tropigas"]' >> "$GITHUB_OUTPUT"
          else
            echo "stores=[\"$STORE\"]" >> "$GITHUB_OUTPUT"
          fi

  crawl:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 350   # por tienda (cada job es independiente)
    strategy:
      fail-fast: false     # si una tienda falla, las demás siguen
      max-parallel: 4
      matrix:
        store: ${{ fromJson(needs.setup.outputs.stores) }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
      - name: Crawl ${{ matrix.store }}
        env:
          OJO_INGEST_URL: ${{ secrets.OJO_INGEST_URL }}
          OJO_INGEST_KEY: ${{ secrets.OJO_INGEST_KEY }}
        run: php web/cli/crawl_sitemap.php "${{ matrix.store }}"
