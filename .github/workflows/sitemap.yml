name: Crawl Magento por sitemap (Gallo + Unicomer)

# Cada tienda corre como job paralelo (matriz). Las grandes se SHARDEAN en varios
# jobs (porciones del sitemap) para no chocar el límite de ~6h de Actions:
# Tropigas (~9k productos, 1 fetch OG c/u) se parte en 3 trozos de ~3k (~2h c/u).

on:
  workflow_dispatch:
    inputs:
      store:
        description: 'Tienda (all, gallo, lacuracao, radioshack, tropigas)'
        required: true
        default: 'all'
  schedule:
    - cron: '30 8 * * *'   # diario 08:30 UTC — después del crawl VTEX

jobs:
  # Arma la lista de jobs {store, shard, of}: Tropigas en 3 trozos, el resto entero.
  setup:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.pick.outputs.jobs }}
    steps:
      - id: pick
        run: |
          STORE="${{ github.event.inputs.store || 'all' }}"
          case "$STORE" in
            all)
              echo 'jobs=[{"store":"gallo","shard":1,"of":1},{"store":"lacuracao","shard":1,"of":1},{"store":"radioshack","shard":1,"of":1},{"store":"tropigas","shard":1,"of":3},{"store":"tropigas","shard":2,"of":3},{"store":"tropigas","shard":3,"of":3}]' >> "$GITHUB_OUTPUT"
              ;;
            tropigas)
              echo 'jobs=[{"store":"tropigas","shard":1,"of":3},{"store":"tropigas","shard":2,"of":3},{"store":"tropigas","shard":3,"of":3}]' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "jobs=[{\"store\":\"$STORE\",\"shard\":1,\"of\":1}]" >> "$GITHUB_OUTPUT"
              ;;
          esac

  crawl:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        job: ${{ fromJson(needs.setup.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
      - name: Crawl ${{ matrix.job.store }} (shard ${{ matrix.job.shard }}/${{ matrix.job.of }})
        env:
          OJO_INGEST_URL: ${{ secrets.OJO_INGEST_URL }}
          OJO_INGEST_KEY: ${{ secrets.OJO_INGEST_KEY }}
        run: php web/cli/crawl_sitemap.php "${{ matrix.job.store }}" "${{ matrix.job.shard }}" "${{ matrix.job.of }}"
