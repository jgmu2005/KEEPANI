name: Crawl Magento por sitemap (Gallo + Unicomer)

on:
  workflow_dispatch:
    inputs:
      store:
        description: 'Tienda (all, gallo, lacuracao, radioshack, tropigas)'
        required: true
        default: 'all'
  schedule:
    - cron: '30 8 * * *'   # diario 08:30 UTC — después del crawl VTEX (refresco de precios/stock)

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # Tropigas ~9k productos (1 fetch OG por producto)
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
      - name: Crawl por sitemap
        env:
          OJO_INGEST_URL: ${{ secrets.OJO_INGEST_URL }}
          OJO_INGEST_KEY: ${{ secrets.OJO_INGEST_KEY }}
        run: php web/cli/crawl_sitemap.php "${{ github.event.inputs.store || 'all' }}"
