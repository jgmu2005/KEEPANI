name: Crawl Shopify (Simple Technic)

# Baja/refresca el catálogo de tiendas Shopify vía /products.json (paginado).
# Cada corrida agrega un punto de precio por producto.
on:
  workflow_dispatch:
    inputs:
      store:
        description: 'Tienda (simpletechnic o all)'
        required: true
        default: 'all'
  schedule:
    - cron: '30 8 * * *'   # diario ~08:30 UTC (después del crawl principal)

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json

      - name: Crawl Shopify
        env:
          OJO_INGEST_URL: ${{ secrets.OJO_INGEST_URL }}
          OJO_INGEST_KEY: ${{ secrets.OJO_INGEST_KEY }}
        run: php web/cli/crawl_shopify.php "${{ github.event.inputs.store || 'all' }}"
