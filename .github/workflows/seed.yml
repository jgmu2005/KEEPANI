name: Seed rápido VTEX (top ~2500, manual)

# Seed rápido del top ~2500 por tienda (paginación plana). Manual solamente.
# El refresco diario COMPLETO (por categorías) lo hace el workflow "Crawl catálogo completo".
on:
  workflow_dispatch:
    inputs:
      store:
        description: 'Tienda (sinsa, siman o all)'
        required: true
        default: 'all'

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json

      - name: Correr el crawler y enviar a la ingesta
        env:
          OJO_INGEST_URL: ${{ secrets.OJO_INGEST_URL }}
          OJO_INGEST_KEY: ${{ secrets.OJO_INGEST_KEY }}
        run: php web/cli/seed_remote.php "${{ github.event.inputs.store || 'all' }}"
