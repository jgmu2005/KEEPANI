name: Catálogo VTEX — seed y refresco diario

# Cómo se dispara:
#  - Manual: Actions → este workflow → Run workflow (elegís la tienda).
#  - Automático: todos los días re-crawlea el catálogo = refresco de precios.
on:
  workflow_dispatch:
    inputs:
      store:
        description: 'Tienda (sinsa, siman o all)'
        required: true
        default: 'all'
  schedule:
    - cron: '0 11 * * *'   # diario 11:00 UTC (~5:00 AM Managua) — refresco de precios VTEX

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json

      - name: Correr el crawler y enviar a la ingesta
        env:
          OJO_INGEST_URL: ${{ secrets.OJO_INGEST_URL }}
          OJO_INGEST_KEY: ${{ secrets.OJO_INGEST_KEY }}
        run: php web/cli/seed_remote.php "${{ github.event.inputs.store || 'all' }}"
