name: Crawl Tigo (catálogo prepago)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'   # diario 08:00 UTC

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
      - name: Crawl Tigo
        env:
          OJO_INGEST_URL: ${{ secrets.OJO_INGEST_URL }}
          OJO_INGEST_KEY: ${{ secrets.OJO_INGEST_KEY }}
        run: php web/cli/crawl_tigo.php
